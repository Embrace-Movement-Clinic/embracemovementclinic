<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; background: #000; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// Embrace Movement Clinic: canvas scenes from the motion exploration (Nov 2026).
// Only `mist` is used on the site (light page headers); `silk` and `tide` were earlier
// directions, kept so they can be rendered again. Render with render.py in this folder.
// Embrace Movement Clinic — generative loops.
// Every motion term uses an integer multiple of phi = 2*pi*t (t in [0,1)), so each loop is seamless.
const TAU = Math.PI * 2;
const P = {
  petrol950: [2, 39, 43], petrol900: [8, 61, 66], petrol800: [19, 87, 94], petrol700: [33, 115, 123],
  petrol500: [79, 174, 184], petrol400: [112, 194, 203], petrol300: [152, 213, 220], petrol200: [190, 229, 233],
  petrol100: [220, 242, 244], mist: [242, 248, 248],
  teal600: [23, 150, 119], teal500: [58, 181, 147], teal400: [99, 201, 169], teal300: [144, 219, 193],
  teal200: [186, 232, 215], teal100: [218, 244, 234], teal50: [238, 250, 245], white: [255, 255, 255],
};
const rgba = (c, a) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;
const mix = (a, b, k) => [a[0] + (b[0] - a[0]) * k, a[1] + (b[1] - a[1]) * k, a[2] + (b[2] - a[2]) * k].map(Math.round);
const hash = (n) => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const smooth = (a, b, x) => { const k = Math.min(1, Math.max(0, (x - a) / (b - a))); return k * k * (3 - 2 * k); };

const canvas = document.getElementById('c');
let ctx, W, H, U; // U = unit scale (1 at 1080 px on the short side)
let noiseLight = null, noiseDark = null, glow = null;

function setup(w, h) {
  W = w; H = h; canvas.width = w; canvas.height = h;
  ctx = canvas.getContext('2d');
  U = Math.min(w, h) / 1080;
  const mk = (rgb, maxA) => {
    const n = document.createElement('canvas'); n.width = w; n.height = h;
    const x = n.getContext('2d'); const d = x.createImageData(w, h);
    let seed = 1337;
    for (let i = 0; i < d.data.length; i += 4) {
      seed = (seed * 1664525 + 1013904223) >>> 0;
      d.data[i] = rgb[0]; d.data[i + 1] = rgb[1]; d.data[i + 2] = rgb[2];
      d.data[i + 3] = (seed >>> 24) / 255 * maxA;
    }
    x.putImageData(d, 0, 0); return n;
  };
  noiseLight = mk([255, 255, 255], 9);
  noiseDark = mk([0, 40, 44], 8);
  glow = document.createElement('canvas');
  glow.width = Math.ceil(w / 4); glow.height = Math.ceil(h / 4);
}

// Draw a ribbon made of N fine lines around a spine.
// o.spine(s) -> [x, y]; o.width(s) -> signed half width; o.fold(s, v) -> extra offset along the normal;
// o.colour(v, i) -> rgb; o.alpha(v, i) -> line alpha; o.grad -> [x0, y0, x1, y1, stops[[pos, k]]] alpha ramp across the frame.
function ribbon(c, o, scale = 1) {
  const steps = o.steps || 260;
  const ds = 1 / steps;
  // Pre-compute the spine and its normals.
  const sp = [];
  for (let j = 0; j <= steps; j++) {
    const s = j * ds;
    const a = o.spine(s - 0.002), b = o.spine(s + 0.002), p = o.spine(s);
    let tx = b[0] - a[0], ty = b[1] - a[1]; const l = Math.hypot(tx, ty) || 1; tx /= l; ty /= l;
    sp.push([p[0], p[1], -ty, tx, o.width(s)]);
  }
  c.lineCap = 'round'; c.lineJoin = 'round';
  for (let i = 0; i < o.N; i++) {
    const v = o.N === 1 ? 0 : -1 + 2 * i / (o.N - 1);
    const col = o.colour(v, i), al = o.alpha(v, i);
    if (al <= 0.002) continue;
    const g = c.createLinearGradient(o.grad[0] * scale, o.grad[1] * scale, o.grad[2] * scale, o.grad[3] * scale);
    for (const [pos, k] of o.grad[4]) g.addColorStop(pos, rgba(col, Math.min(1, al * k)));
    c.strokeStyle = g;
    c.lineWidth = (o.lw ? o.lw(v, i) : 1.1 * U) * scale;
    c.beginPath();
    for (let j = 0; j <= steps; j++) {
      const q = sp[j]; const d = v * q[4] + o.fold(j * ds, v);
      const x = (q[0] + q[2] * d) * scale, y = (q[1] + q[3] * d) * scale;
      if (j === 0) c.moveTo(x, y); else c.lineTo(x, y);
    }
    c.stroke();
  }
}

// Ribbon plus a soft bloom (drawn at quarter size, blurred, added back).
function ribbonWithGlow(o, glowAlpha, blurPx, mode = 'lighter') {
  const g = glow.getContext('2d');
  g.clearRect(0, 0, glow.width, glow.height);
  g.globalCompositeOperation = mode === 'lighter' ? 'lighter' : 'source-over';
  ribbon(g, { ...o, lw: () => 3.2 * U }, 0.25);
  ctx.save();
  ctx.globalCompositeOperation = mode;
  ctx.globalAlpha = glowAlpha;
  ctx.filter = `blur(${blurPx * U}px)`;
  ctx.drawImage(glow, 0, 0, W, H);
  ctx.filter = 'none';
  ctx.globalAlpha = 1;
  ribbon(ctx, o);
  ctx.restore();
}

// A soft veil of the page colour over the zone where the page's text sits, so text keeps AA contrast.
function veil(c, x0, y0, x1, y1, stops) {
  const g = ctx.createLinearGradient(x0, y0, x1, y1);
  for (const [pos, a] of stops) g.addColorStop(pos, rgba(c, a));
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}

function radial(x, y, r, c, a0, a1 = 0) {
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, rgba(c, a0)); g.addColorStop(0.55, rgba(c, a0 * 0.45 + a1 * 0.55)); g.addColorStop(1, rgba(c, a1));
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}

// ---------------------------------------------------------------------------------------------
// 1. SILK — hero loop on petrol. A slow ribbon of fine teal lines; calmer on the text side.
// ---------------------------------------------------------------------------------------------
function silk(t) {
  const phi = TAU * t;
  const portrait = H > W;
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = rgba(P.petrol900, 1); ctx.fillRect(0, 0, W, H);
  // Depth: a soft lighter pool that drifts, and a deeper corner.
  const gx = portrait ? W * (0.62 + 0.05 * Math.sin(phi)) : W * (0.70 + 0.04 * Math.sin(phi));
  const gy = portrait ? H * (0.60 + 0.03 * Math.cos(phi)) : H * (0.42 + 0.05 * Math.cos(phi));
  radial(gx, gy, Math.max(W, H) * 0.50, P.petrol700, 0.26);
  radial(portrait ? W * 0.1 : W * 1.02, portrait ? H * 1.02 : H * 1.05, Math.max(W, H) * 0.55, P.petrol950, 0.45);

  // Spine: a long, gentle S from lower left to upper right (the site's curve motif, set in motion).
  const spineA = portrait
    ? (s) => {
        const x = W * (-0.25 + 1.5 * s);
        const y = H * (0.80 - 0.42 * s) + H * 0.060 * Math.sin(TAU * (0.85 * s) + phi + 0.4) + H * 0.022 * Math.sin(TAU * (1.9 * s) - phi + 2.0);
        return [x, y];
      }
    : (s) => {
        const x = W * (-0.12 + 1.24 * s);
        const y = H * (0.86 - 0.62 * s) + H * 0.105 * Math.sin(TAU * (0.85 * s) + phi + 0.4) + H * 0.040 * Math.sin(TAU * (1.9 * s) - phi + 2.0);
        return [x, y];
      };
  const span = portrait ? H * 0.15 : H * 0.22;
  const widthA = (s) => span * (0.62 * Math.sin(TAU * (0.72 * s) + phi + 1.1) + 0.38 * Math.sin(TAU * (1.35 * s) - phi + 0.2));
  const foldA = (s, v) => span * 0.20 * Math.sin(TAU * (1.15 * s + 0.42 * v) + 2 * phi + 0.7) * (0.35 + 0.65 * Math.abs(v));
  // Alpha ramp across the frame: quiet where the page's text sits, fuller away from it.
  const ramp = portrait
    ? [0, H * 0.2, 0, H, [[0, 0.8], [1, 1]]]
    : [0, 0, W, 0, [[0, 0.0], [0.05, 0.55], [0.40, 0.75], [0.66, 1], [1, 1]]];

  // Back layer: wide, soft, out of focus.
  ctx.save();
  ctx.filter = `blur(${18 * U}px)`;
  ctx.globalCompositeOperation = 'lighter';
  ribbon(ctx, {
    N: 34, steps: 200,
    spine: (s) => { const p = spineA(Math.min(1, Math.max(0, s))); return [p[0] + W * 0.03, p[1] - H * 0.10 + H * 0.03 * Math.sin(TAU * s * 0.6 - phi)]; },
    width: (s) => span * 1.5 * Math.sin(TAU * (0.5 * s) - phi + 2.6),
    fold: (s, v) => span * 0.3 * Math.sin(TAU * (0.8 * s + 0.3 * v) + phi),
    colour: () => mix(P.petrol500, P.teal500, 0.5), alpha: () => 0.10, lw: () => 5 * U, grad: ramp,
  });
  ctx.restore();

  // Main ribbon.
  ribbonWithGlow({
    N: portrait ? 84 : 104,
    spine: spineA, width: widthA, fold: foldA,
    colour: (v, i) => { const h = hash(i); return h > 0.93 ? mix(P.teal300, P.white, 0.45) : mix(mix(P.teal500, P.petrol400, 0.18 + 0.18 * v), P.teal300, hash(i + 40) * 0.7); },
    alpha: (v, i) => (hash(i) > 0.93 ? 0.42 : 0.15 + 0.10 * hash(i + 9)) * (0.55 + 0.45 * (1 - v * v)),
    grad: ramp,
  }, 0.55, 22);

  // A second, finer strand that crosses the main one.
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ribbon(ctx, {
    N: 26,
    spine: (s) => { const p = spineA(s); return [p[0], p[1] + span * (0.95 * Math.sin(TAU * (0.6 * s) - phi + 3.4))]; },
    width: (s) => span * 0.26 * Math.sin(TAU * (1.1 * s) + phi + 4.0),
    fold: (s, v) => span * 0.05 * Math.sin(TAU * (2.1 * s + 0.5 * v) - 2 * phi),
    colour: (v, i) => mix(P.teal300, P.teal200, hash(i + 3)), alpha: () => 0.15, lw: () => 0.9 * U, grad: ramp,
  });
  ctx.restore();

  if (portrait) veil(P.petrol900, 0, 0, 0, H, [[0, 0.76], [0.51, 0.76], [0.60, 0.40], [0.69, 0.40], [0.755, 0.78], [1, 0.78]]);
  else veil(P.petrol900, 0, 0, W, 0, [[0, 0.78], [0.47, 0.78], [0.72, 0], [1, 0]]);
  ctx.drawImage(noiseLight, 0, 0);
}

// ---------------------------------------------------------------------------------------------
// 2. TIDE — wide band loop on petrol. Layered soft swells with fine teal rim lines, low in frame.
// ---------------------------------------------------------------------------------------------
function tide(t) {
  const phi = TAU * t;
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = rgba(P.petrol900, 1); ctx.fillRect(0, 0, W, H);
  radial(W * (0.78 + 0.03 * Math.sin(phi)), H * 1.1, W * 0.6, P.petrol700, 0.5);
  radial(W * 0.0, H * 1.2, W * 0.5, P.petrol950, 0.5);

  const L = 5;
  for (let k = 0; k < L; k++) {
    const d = k / (L - 1); // 0 back, 1 front
    const base = H * (0.56 + 0.085 * k);
    const amp = H * (0.070 + 0.010 * k);
    const dir = k % 2 ? -1 : 1;
    const f1 = 0.62 + 0.09 * k, f2 = 1.15 + 0.13 * k;
    const p1 = k * 1.9, p2 = k * 0.7 + 1.0;
    const y = (x) => base
      + amp * Math.sin(TAU * (f1 * x / W) + dir * phi + p1)
      + amp * 0.45 * Math.sin(TAU * (f2 * x / W) - dir * phi + p2)
      + amp * 0.10 * Math.sin(TAU * (2.1 * x / W) + 2 * dir * phi + p1 * 2);
    const step = 8;
    // Body of the swell.
    ctx.beginPath(); ctx.moveTo(-10, H + 10);
    for (let x = -10; x <= W + 10; x += step) ctx.lineTo(x, y(x));
    ctx.lineTo(W + 10, H + 10); ctx.closePath();
    const g = ctx.createLinearGradient(0, base - amp * 1.6, 0, H);
    g.addColorStop(0, rgba(mix(P.petrol800, P.petrol700, 0.25 + 0.3 * d), 0.34));
    g.addColorStop(0.5, rgba(P.petrol800, 0.16));
    g.addColorStop(1, rgba(P.petrol950, 0.30));
    ctx.fillStyle = g; ctx.fill();
    // Rim: a few fine lines hugging the crest, with a highlight that travels along it.
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    for (let r = 0; r < 8; r++) {
      const hx = W * (0.5 + 0.45 * Math.sin(phi * dir + k * 1.3));
      const lg = ctx.createLinearGradient(hx - W * 0.6, 0, hx + W * 0.6, 0);
      const a = (0.50 - 0.055 * r) * (0.55 + 0.45 * d);
      const col = r === 0 ? mix(P.teal300, P.white, 0.2) : mix(P.teal400, P.petrol500, r / 8);
      lg.addColorStop(0, rgba(col, 0)); lg.addColorStop(0.5, rgba(col, a)); lg.addColorStop(1, rgba(col, 0));
      ctx.strokeStyle = lg; ctx.lineWidth = (r === 0 ? 1.4 : 1.0) * U;
      ctx.beginPath();
      const off = r * (5 + 2 * d) * (H / 640);
      for (let x = -10; x <= W + 10; x += step) {
        const yy = y(x) + off * (1.15 + 0.85 * Math.sin(TAU * (0.9 * x / W) + dir * phi + k));
        if (x === -10) ctx.moveTo(x, yy); else ctx.lineTo(x, yy);
      }
      ctx.stroke();
    }
    ctx.restore();
  }
  ctx.globalCompositeOperation = 'source-over';
  ctx.drawImage(noiseLight, 0, 0);
}

// ---------------------------------------------------------------------------------------------
// 3. MIST — light loop on the site's cool mist. Pale drifting colour with a faint teal ribbon.
// ---------------------------------------------------------------------------------------------
function mist(t) {
  const phi = TAU * t;
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = rgba(P.mist, 1); ctx.fillRect(0, 0, W, H);
  const R = Math.max(W, H);
  radial(W * (0.80 + 0.07 * Math.sin(phi)), H * (0.30 + 0.10 * Math.cos(phi)), R * 0.50, P.teal100, 0.95);
  radial(W * (0.58 + 0.08 * Math.cos(phi + 1.0)), H * (0.85 + 0.08 * Math.sin(phi + 1.0)), R * 0.46, P.petrol100, 0.95);
  radial(W * (0.98 + 0.04 * Math.sin(2 * phi + 2.0)), H * (0.80 + 0.10 * Math.cos(phi + 2.5)), R * 0.36, P.teal200, 0.55);
  radial(W * (0.30 + 0.06 * Math.sin(phi + 3.0)), H * (0.20 + 0.08 * Math.cos(phi + 3.0)), R * 0.42, P.white, 0.9);
  radial(W * (0.72 + 0.05 * Math.cos(phi + 4.0)), H * (0.55 + 0.06 * Math.sin(2 * phi + 4.0)), R * 0.22, P.white, 0.65);

  // Upright (phone) frames: the header text runs the full width, so the ribbon crosses the lower
  // part of the frame and the whole frame stays readable.
  const portrait = H > W;
  const S = portrait ? W : H;
  const span = S * (portrait ? 0.30 : 0.24);
  const spine = portrait
    ? (s) => {
        const x = W * (-0.25 + 1.50 * s);
        const y = H * (0.90 - 0.68 * s) + H * 0.07 * Math.sin(TAU * (0.8 * s) - phi + 1.4) + H * 0.025 * Math.sin(TAU * (1.8 * s) + phi + 0.3);
        return [x, y];
      }
    : (s) => {
        const x = W * (-0.12 + 1.24 * s);
        const y = H * (0.92 - 0.66 * s) + H * 0.10 * Math.sin(TAU * (0.8 * s) - phi + 1.4) + H * 0.035 * Math.sin(TAU * (1.8 * s) + phi + 0.3);
        return [x, y];
      };
  const ramp = portrait
    ? [0, 0, 0, H, [[0, 0.7], [1, 1]]]
    : [0, 0, W, 0, [[0, 0], [0.06, 0.6], [0.45, 0.8], [0.7, 1], [1, 1]]];
  // Soft back strand.
  ctx.save(); ctx.filter = `blur(${6 * U}px)`;
  ribbon(ctx, {
    N: 28, steps: 200,
    spine: (s) => { const p = spine(s); return [p[0], p[1] - S * 0.12]; },
    width: (s) => span * 1.4 * Math.sin(TAU * (0.5 * s) + phi + 0.8),
    fold: (s, v) => span * 0.25 * Math.sin(TAU * (0.9 * s + 0.3 * v) - phi),
    colour: () => P.petrol300, alpha: () => 0.16, lw: () => 2.4 * U, grad: ramp,
  });
  ctx.restore();
  ribbonWithGlow({
    N: 96, spine,
    width: (s) => span * (0.62 * Math.sin(TAU * (0.72 * s) - phi + 0.3) + 0.38 * Math.sin(TAU * (1.35 * s) + phi + 1.6)),
    fold: (s, v) => span * 0.20 * Math.sin(TAU * (1.15 * s + 0.42 * v) - 2 * phi + 0.2) * (0.35 + 0.65 * Math.abs(v)),
    colour: (v, i) => { const h = hash(i + 5); return h > 0.9 ? P.teal600 : mix(mix(P.teal500, P.petrol500, 0.5 + 0.5 * v), P.teal400, hash(i + 21) * 0.5); },
    alpha: (v, i) => (hash(i + 5) > 0.9 ? 0.34 : 0.15 + 0.08 * hash(i + 2)) * (0.55 + 0.45 * (1 - v * v)),
    grad: ramp,
  }, 0.35, 20, 'source-over');

  // No veil is baked in: the page lays a scrim behind its own text column (PageHero.astro),
  // so text stays readable at every screen width and the ribbon shows wherever text isn't.
  ctx.drawImage(noiseDark, 0, 0);
  ctx.globalAlpha = 0.6; ctx.drawImage(noiseLight, 0, 0); ctx.globalAlpha = 1;
}

window.setMistVeil = () => {};
const SCENES = { silk, tide, mist };
window.setup = setup;
window.renderAt = (name, t) => { SCENES[name](t); return true; };
</script>
</body>
</html>
